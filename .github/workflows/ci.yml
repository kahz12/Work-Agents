name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose: lint failures block the build, so a new release that stabilises
      # rules could break CI without any code change. Bump it by hand.
      - run: pip install ruff==0.17.5
      # This job runs on a clean checkout, before any demo writes artefacts, so ruff only
      # sees committed source. Formatting (`ruff format`) is not checked: the code base does
      # not follow that style.
      - name: Errors, style and import order (E, F, W, I)
        run: ruff check .
      # Pinned for the same reason: a new mypy release can report new errors without any code
      # change. The crypto extra is installed so argon2 and bcrypt are checked with their real types.
      - run: pip install -e ".[crypto]" mypy==2.4.1 types-PyYAML==6.0.12.20261113
      - name: Types (mypy, configured in pyproject.toml)
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]"
      - name: pytest suite
        run: coverage run -m pytest -q
      - name: End-to-end check of the 8 agents
        run: coverage run --append test_all_agents.py
      # Combined coverage of both runs; the minimum lives in [tool.coverage.report] in pyproject.toml.
      - name: Coverage
        run: coverage report

  self-audit:
    name: Self-audit of the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The tool audits its own code. Deliberate findings (the tests' corpus of fake secrets,
      # the intentionally vulnerable demos) are reviewed and recorded in .agentes-baseline.json,
      # so the job only fails on new findings. The AST engine is used because the baseline was
      # generated with it.
      - name: agentes pipeline on the repository
        run: agentes pipeline . -o reports --no-bandit --baseline .agentes-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-audit
          path: reports/

  wheel:
    name: Installable wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      # Install outside the checkout: if the wheel is missing a package, this catches it.
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: The installed CLI must work without the checkout
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          printf 'def ok():\n    return 1\n' > s.py
          export AGENTES_WORKDIR=/tmp/probe/out
          /tmp/venv/bin/agentes --version
          /tmp/venv/bin/agentes list
          /tmp/venv/bin/agentes analyze s.py -o /tmp/probe/rep
          /tmp/venv/bin/agentes generate compose -o /tmp/probe/dc.yml
          /tmp/venv/bin/agentes generate helm -o /tmp/probe/chart
          /tmp/venv/bin/agentes generate nginx -o /tmp/probe/nginx.conf
          /tmp/venv/bin/agentes generate openapi -o /tmp/probe/oa.json --source s.py
          /tmp/venv/bin/agentes generate tests -o /tmp/probe/test_s.py --source s.py
          /tmp/venv/bin/agentes pipeline /tmp/probe -o /tmp/probe/p --no-fail --offline
          /tmp/venv/bin/agentes generate tests -o /tmp/probe/test_rec.py --source s.py --record
          /tmp/venv/bin/agentes secrets /tmp/probe
          /tmp/venv/bin/agentes doctor
          for a in defensive quality hardening refactor qa sre devops docs; do
            /tmp/venv/bin/agentes demo "$a" > /dev/null
          done
      - name: The demos must not write inside the installation
        run: |
          test -z "$(find /tmp/venv/lib -name 'qa_report.html' -o -name 'openapi.json' -o -name 'results.sarif')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
