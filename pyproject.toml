[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentes-devsecops"
dynamic = ["version"]
description = "Modular DevSecOps, SRE and QA agents for Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kahz12"}]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "packaging>=21.0",
  "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
crypto = ["argon2-cffi>=23.0", "bcrypt>=4.0"]
sast = ["bandit>=1.7"]
dev = ["pytest>=7.0", "ruff>=0.4", "pyflakes>=3.0", "coverage>=7.0"]
all = ["argon2-cffi>=23.0", "bcrypt>=4.0", "bandit>=1.7", "pytest>=7.0", "ruff>=0.4", "pyflakes>=3.0", "coverage>=7.0"]

[project.scripts]
agentes = "agentes.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agentes.__version__"}

[tool.setuptools]
# Explicit list: a test checks that every agent ships in the wheel and that no top-level
# package other than "agentes" gets installed.
packages = [
  "agentes",
  "agentes.cli",
  "agentes.common",
  "agentes.defensive",
  "agentes.quality",
  "agentes.hardening",
  "agentes.refactor",
  "agentes.qa",
  "agentes.qa.fixtures",
  "agentes.sre",
  "agentes.devops",
  "agentes.docs",
  "agentes.docs.fixtures",
]

[tool.ruff]
line-length = 120
target-version = "py39"
# Skip tool caches, artefacts generated by the demos, and the deliberately vulnerable samples they write.
exclude = [
  "reports", ".venv", "venv", "venv313", "__pycache__", "build", "dist",
  "agentes/devops/my-helm-chart", "agentes/qa/sample_app.py", "agentes/qa/test_sample_app.py",
  "agentes/qa/test_sample_app_pytest.py",
  "agentes/docs/sample_api.py", "agentes/quality/sample_code.py",
  "agentes/refactor/sample_monolith.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agentes_cli.py" = ["E402"]

[tool.mypy]
# Type checking for the package. The optional extras (argon2, bcrypt, bandit) either ship no
# type information or may not be installed.
files = ["agentes"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CI combines the coverage of pytest and test_all_agents.py (which runs every agent's demo)
# and fails below the minimum. Raise the minimum by hand when coverage improves.
[tool.coverage.run]
source = ["agentes"]
# The fixtures are the sample code the demos analyse; they are never executed.
omit = ["agentes/*/fixtures/*"]

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true
